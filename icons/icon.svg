<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icône « Bonbon », version ronde (PC, favicon). Source des fichiers icon-192.png et icon-512.png. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8FB1"/>
      <stop offset="1" stop-color="#FFC3A0"/>
    </linearGradient>
    <filter id="ombre" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <path id="etoile" d="M0 -30 Q 0 0 30 0 Q 0 0 0 30 Q 0 0 -30 0 Q 0 0 0 -30 Z"/>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#fond)"/>
  <g transform="translate(256 256) scale(0.9) translate(-256 -256)">
    <rect x="146" y="162" width="220" height="220" rx="60" fill="#D9507A" opacity="0.35" filter="url(#ombre)" transform="rotate(-8 256 272)"/>
    <rect x="146" y="150" width="220" height="220" rx="60" fill="#fff" transform="rotate(-8 256 260)"/>
    <path d="M196 266 L244 312 L322 218" fill="none" stroke="#FF6F9C" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#etoile" transform="translate(392 118) scale(1.2)" fill="#FFE27A"/>
    <use href="#etoile" transform="translate(112 402) scale(0.8)" fill="#fff"/>
    <use href="#etoile" transform="translate(420 380) scale(0.55)" fill="#FFE27A"/>
  </g>
</svg>
