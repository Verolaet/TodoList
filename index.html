<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Laeti’s todo</title>
  <meta name="theme-color" content="#CECBF6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    (function () {
      var h = document.documentElement;
      var t = localStorage.getItem('theme') || 'auto';
      h.dataset.space = localStorage.getItem('space') === 'pro' ? 'pro' : 'perso';
      if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) h.classList.add('dark');
    })();
  </script>
  <script src="version.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loading" class="center"><div class="spinner" aria-label="Chargement"></div></div>

  <main id="login" class="center" hidden>
    <div class="login-card">
      <h1>Laeti’s todo</h1>
      <p>Pro et perso, au même endroit.</p>
      <button id="loginBtn" class="primary big">Se connecter avec Google</button>
      <p id="loginError" class="error" hidden></p>
      <p class="version" data-version></p>
    </div>
  </main>

  <div id="app" class="wrap" hidden>
    <header class="top">
      <nav class="tabs" role="tablist">
        <button class="tab" data-space="perso" role="tab">Perso</button>
        <button class="tab" data-space="pro" role="tab">Pro</button>
      </nav>
      <button id="settingsBtn" class="icon-btn" aria-label="Réglages">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <div id="dbError" class="banner" hidden></div>

    <form id="quickAdd" class="quick card" autocomplete="off">
      <input id="quickInput" type="text" placeholder="Nouvelle tâche…" enterkeyhint="done">
      <button type="button" id="micBtn" class="icon-btn mic" aria-label="Dicter une tâche">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>
      </button>
    </form>
    <p id="quickHint" class="hint" hidden></p>

    <div class="toolbar">
      <label class="sort">
        <span>Tri</span>
        <select id="sortSelect">
          <option value="custom">Personnalisé</option>
          <option value="due">Échéance</option>
          <option value="priority">Priorité</option>
        </select>
      </label>
      <div id="labelChips" class="chips"></div>
    </div>

    <section class="card list-card">
      <ul id="activeList" class="list"></ul>
      <p id="emptyState" class="empty" hidden>Rien à faire ici pour l'instant.</p>
    </section>

    <section id="pausedSection" class="done-section" hidden>
      <div class="done-head">
        <button type="button" id="pausedToggle" class="section-toggle open" aria-expanded="true">
          <span id="pausedTitle">En pause</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div id="pausedCard" class="card list-card"><ul id="pausedList" class="list"></ul></div>
    </section>

    <section id="doneSection" class="done-section" hidden>
      <div class="done-head">
        <button type="button" id="doneToggle" class="section-toggle open" aria-expanded="true">
          <span id="doneTitle">Terminées</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button id="clearDoneBtn" class="link-btn">Supprimer les terminées</button>
      </div>
      <div id="doneCard" class="card list-card"><ul id="doneList" class="list"></ul></div>
    </section>

    <footer class="version" data-version></footer>
  </div>

  <datalist id="labelsList"></datalist>

  <dialog id="editor">
    <form id="editForm">
      <label class="field">Titre
        <textarea name="title" rows="2" required></textarea>
      </label>
      <label class="field">Statut
        <select name="status">
          <option value="0">Non démarrée</option>
          <option value="1">En cours</option>
          <option value="2">Terminée</option>
          <option value="3">En pause</option>
        </select>
      </label>
      <div class="field-row">
        <label class="field">Échéance
          <input type="date" name="due">
        </label>
        <label class="field">Priorité
          <select name="priority">
            <option value="">Aucune</option>
            <option value="1">Haute</option>
            <option value="2">Moyenne</option>
            <option value="3">Basse</option>
          </select>
        </label>
      </div>
      <label class="field" id="labelField">Étiquette
        <input name="label" list="labelsList" autocomplete="off" placeholder="Aucune">
      </label>
      <section id="subsEditor" class="subs-editor">
        <h3>Sous-tâches</h3>
        <ul id="subsEditList"></ul>
        <div class="addsub">
          <input id="newSubInput" type="text" placeholder="Ajouter une sous-tâche" enterkeyhint="done">
          <button type="button" id="addSubBtn" class="icon-btn" aria-label="Ajouter la sous-tâche">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </section>
      <div class="actions">
        <button type="button" id="deleteTaskBtn" class="danger">Supprimer</button>
        <span class="spacer"></span>
        <button type="button" id="cancelEditBtn">Annuler</button>
        <button type="submit" class="primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings">
    <h2>Réglages</h2>
    <div class="field">Thème
      <div class="segmented" id="themeSeg">
        <button type="button" data-theme="auto">Auto</button>
        <button type="button" data-theme="light">Clair</button>
        <button type="button" data-theme="dark">Sombre</button>
      </div>
    </div>
    <button type="button" id="exportBtn" class="wide">Exporter mes tâches (CSV)</button>
    <p class="muted small">Connectée : <span id="userEmail"></span></p>
    <p class="muted small" data-version></p>
    <div class="actions">
      <button type="button" id="logoutBtn" class="danger">Se déconnecter</button>
      <span class="spacer"></span>
      <button type="button" id="closeSettingsBtn" class="primary">Fermer</button>
    </div>
  </dialog>

  <dialog id="confirmDlg">
    <p id="confirmMsg"></p>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" id="confirmNo">Annuler</button>
      <button type="button" id="confirmYes" class="danger-fill">Supprimer</button>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
